<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TrailQuest</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
          margin: 0;             /* Remove default browser margin */
          padding: 0;            /* Remove default browser padding */
          height: 100%;          /* Ensure full screen height */
        }
      </style>
</head>
<body>
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg" style="background-color: #198754; color: white;">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="#">TrailQuest</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    {% if user.is_authenticated %}
                        <!-- Links for logged-in users -->
                        <li class="nav-item">
                            <a class="nav-link text-white" href="{% url 'home.about' %}">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="{% url 'trip_preferences' %}">Plan a Trip</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="{% url 'trip_suggestions' %}">Current Itinerary</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="{% url 'past_trips' %}">Past Itineraries</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-black" href="{% url 'accounts.logout' %}">Logout</a>
                        </li>
                    {% else %}
                        <!-- Links for logged-out users -->
                        <li class="nav-item">
                            <a class="nav-link text-white" href="{% url 'home.about' %}">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="{% url 'accounts.signup' %}">Sign Up</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="{% url 'accounts.login' %}">Sign In</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
