{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="py-5" style="background-color: #d0f0f2; min-height: 100vh;">
  <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-lg-6">
      <div class="card shadow-lg rounded border-0 p-4">
        <div class="card-body">
          <h2 class="text-center text-danger mb-3">Reset Password</h2>
          <p class="text-muted text-center">Enter your new password below</p>
          <hr />

          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-danger">{{ message }}</div>
            {% endfor %}
          {% endif %}

          <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-danger w-100">Reset Password</button>
          </form>

          <div class="mt-4 text-center">
            <p>Back to <a href="{% url 'accounts.login' %}" class="text-danger fw-bold">Login</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
